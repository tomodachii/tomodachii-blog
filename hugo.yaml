baseURL: https://blog.tomodachii.com/
languageCode: en-us
title: Tomodachii
theme: 
 - PaperMod
 - hugo-simplecite

pagination:
  disableAliases: false
  pagerSize: 10

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
        enable: true
params:
  math: true
  env: production
  author: ["Me"]
  ShowShareButtons: true
  ShowReadingTime: true
  ShowToc: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  showMenuDivider: true

  homeInfoParams:
    Title: "Hello, This is Tomodachii! 👋"
    Content: >
      My notes on pretty much everything I learn, and my thoughts on various topics. Hope you find something useful here!

  socialIcons:
    - name: "github"
      url: "https://github.com/"
    - name: "instagram"
      url: "https://www.instagram.com/insania.zip/"
    - name: "goodreads"
      url: "https://www.goodreads.com/user/show/69183590-do-tuan-hoang"

  assets:
    favicon: "favicon.png"

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

menu:
  main:
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 10
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

services:
  googleAnalytics:
    id: G-XZ8LPFH6ZQ